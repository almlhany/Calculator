// ==================== نموذج التنبيه ====================
class Alarm {
  String id;
  int hour;
  int minute;
  String label;
  String sound;
  bool repeatDaily;
  bool autoSnooze;
  int snoozeDuration; // بالدقائق
  bool enabled;

  Alarm({
    required this.id,
    required this.hour,
    required this.minute,
    required this.label,
    required this.sound,
    required this.repeatDaily,
    required this.autoSnooze,
    required this.snoozeDuration,
    this.enabled = true,
  });

  Map<String, dynamic> toJson() => {
        'id': id,
        'hour': hour,
        'minute': minute,
        'label': label,
        'sound': sound,
        'repeatDaily': repeatDaily,
        'autoSnooze': autoSnooze,
        'snoozeDuration': snoozeDuration,
        'enabled': enabled,
      };

  factory Alarm.fromJson(Map<String, dynamic> json) => Alarm(
        id: json['id'],
        hour: json['hour'],
        minute: json['minute'],
        label: json['label'],
        sound: json['sound'],
        repeatDaily: json['repeatDaily'],
        autoSnooze: json['autoSnooze'],
        snoozeDuration: json['snoozeDuration'],
        enabled: json['enabled'] ?? true,
      );
}

// ==================== الصفحة الرئيسية ====================
class AlarmHomePage extends StatefulWidget {
  const AlarmHomePage({super.key});

  @override
  State<AlarmHomePage> createState() => _AlarmHomePageState();
}

class _AlarmHomePageState extends State<AlarmHomePage> {
  List<Alarm> alarms = [];
  DateTime currentTime = DateTime.now();
  Timer? _clockTimer;
  Timer? _checkTimer;
  bool _nightMode = false;
  final AudioPlayer _audioPlayer = AudioPlayer();
  String? _activeAlarmId;
  Timer? _autoSnoozeTimer;

  // قائمة النغمات المتاحة (ملفات صوتية - يمكنك إضافة ملفاتك في مجلد assets)
  final Map<String, String> soundNames = {
    'beep': '🔔 بيب كلاسيكي',
    'chime': '🎵 نغمة موسيقية',
    'radar': '📡 رادار',
    'gentle': '🌿 نغمة هادئة',
    'urgent': '⚠️ نغمة عاجلة',
  };

  @override
  void initState() {
    super.initState();
    _loadAlarms();
    _loadNightMode();
    _clockTimer = Timer.periodic(const Duration(seconds: 1), (_) {
      if (mounted) setState(() => currentTime = DateTime.now());
    });
    _checkTimer = Timer.periodic(const Duration(seconds: 1), (_) {
      _checkAlarms();
    });
  }

  @override
  void dispose() {
    _clockTimer?.cancel();
    _checkTimer?.cancel();
    _autoSnoozeTimer?.cancel();
    _audioPlayer.dispose();
    super.dispose();
  }

  // ---------- التخزين ----------
  Future<void> _loadAlarms() async {
    final prefs = await SharedPreferences.getInstance();
    final data = prefs.getString('alarms');
    if (data != null) {
      final List decoded = jsonDecode(data);
      setState(() {
        alarms = decoded.map((e) => Alarm.fromJson(e)).toList();
      });
    }
  }

  Future<void> _saveAlarms() async {
    final prefs = await SharedPreferences.getInstance();
    final data = jsonEncode(alarms.map((a) => a.toJson()).toList());
    await prefs.setString('alarms', data);
  }

  Future<void> _loadNightMode() async {
    final prefs = await SharedPreferences.getInstance();
    setState(() => _nightMode = prefs.getBool('nightMode') ?? false);
  }

  Future<void> _toggleNightMode(bool value) async {
    final prefs = await SharedPreferences.getInstance();
    await prefs.setBool('nightMode', value);
    setState(() => _nightMode = value);
  }


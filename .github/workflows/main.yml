    final cardColor = _nightMode ? const Color(0xFF0A0A0A) : const Color(0xFF1E1E1E);
    final textColor = _nightMode ? Colors.white54 : Colors.white;

    return Scaffold(
      backgroundColor: bgColor,
      appBar: AppBar(
        backgroundColor: bgColor,
        elevation: 0,
        title: const Text(
          '⏰ ساعة التنبيه',
          style: TextStyle(
              color: Color(0xFF4CAF50), fontWeight: FontWeight.bold),
        ),
        centerTitle: true,
        actions: [
          IconButton(

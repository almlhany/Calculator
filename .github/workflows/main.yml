                      decoration: const InputDecoration(
                        labelText: 'مدة الغفوة (دقائق)',
                        labelStyle: TextStyle(color: Colors.white70),
                      ),
                      items: [1, 3, 5, 10, 15].map((e) {
                        return DropdownMenuItem(
                          value: e,
                          child: Text('$e دقيقة'),
                        );
                      }).toList(),
                      onChanged: (v) =>
                          setDialogState(() => snoozeDuration = v!),
                    ),
                    const SizedBox(height: 8),
                    // تكرار يومي
                    CheckboxListTile(
                      contentPadding: EdgeInsets.zero,
                      title: const Text('🔁 تكرار يومي',
                          style: TextStyle(color: Colors.white)),
                      value: repeatDaily,
                      activeColor: const Color(0xFF4CAF50),
                      onChanged: (v) =>
                          setDialogState(() => repeatDaily = v!),
                    ),
                    // غفوة تلقائية
                    CheckboxListTile(
                      contentPadding: EdgeInsets.zero,
                      title: const Text('😴 غفوة تلقائية',
                          style: TextStyle(color: Colors.white)),
                      value: autoSnooze,
                      activeColor: const Color(0xFF4CAF50),
                      onChanged: (v) =>
                          setDialogState(() => autoSnooze = v!),
                    ),
                  ],
                ),
              ),
              actions: [
                TextButton(
                  onPressed: () => Navigator.pop(context),
                  child: const Text('إلغاء',
                      style: TextStyle(color: Colors.white70)),
                ),
                ElevatedButton(
                  style: ElevatedButton.styleFrom(
                    backgroundColor: const Color(0xFF4CAF50),
                  ),
                  onPressed: () {
                    _addAlarm(
                      hour: selectedTime.hour,
                      minute: selectedTime.minute,
                      label: label.isEmpty ? 'تنبيه' : label,
                      sound: sound,

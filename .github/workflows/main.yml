            );
          },
        );
      },
    );
  }

  void _addAlarm({
    required int hour,
    required int minute,
    required String label,
    required String sound,
    required bool repeatDaily,
    required bool autoSnooze,
    required int snoozeDuration,
  }) {
    final alarm = Alarm(
      id: DateTime.now().microsecondsSinceEpoch.toString(),
      hour: hour,
      minute: minute,
      label: label,
      sound: sound,
      repeatDaily: repeatDaily,
      autoSnooze: autoSnooze,
      snoozeDuration: snoozeDuration,
    );
    setState(() => alarms.add(alarm));
    _saveAlarms();
  }

  void _deleteAlarm(String id) {
    setState(() => alarms.removeWhere((a) => a.id == id));
    _saveAlarms();
    if (_activeAlarmId == id) _stopAlarm();
  }

  void _toggleAlarm(String id) {
    setState(() {
      final alarm = alarms.firstWhere((a) => a.id == id);
      alarm.enabled = !alarm.enabled;
    });
    _saveAlarms();
  }

  // ---------- فحص التنبيهات ----------
  void _checkAlarms() {
    if (_activeAlarmId != null) return;
    final now = DateTime.now();
    for (final alarm in alarms) {
      if (!alarm.enabled) continue;
      if (alarm.hour == now.hour &&
          alarm.minute == now.minute &&
          now.second == 0) {
        _triggerAlarm(alarm);
        break;
      }
    }
  }

  // ---------- إطلاق التنبيه ----------
  Future<void> _triggerAlarm(Alarm alarm) async {
    setState(() => _activeAlarmId = alarm.id);
    HapticFeedback.heavyImpact();

    // تشغيل الصوت (يمكنك استبدال الملفات بأصوات مخصصة)
    try {
      // ملاحظة: يجب إضافة ملفات الصوت في مجلد assets وإضافتها في pubspec.yaml
      // await _audioPlayer.play(AssetSource('sounds/${alarm.sound}.mp3'));
      // حالياً سنستخدم صوت النظام كبديل
    } catch (e) {
      debugPrint('خطأ في تشغيل الصوت: $e');
    }

    // نافذة التنبيه
    if (!mounted) return;
    showDialog(
      context: context,
      barrierDismissible: false,
      builder: (context) {
        return WillPopScope(
          onWillPop: () async => false,
          child: AlertDialog(
            backgroundColor: const Color(0xFF1E1E1E),
            shape: RoundedRectangleBorder(
              borderRadius: BorderRadius.circular(20),
              side: const BorderSide(color: Color(0xFF4CAF50), width: 2),
            ),
            title: const Center(
              child: Text('⏰ حان وقت التنبيه!',
                  style: TextStyle(
                      color: Color(0xFF4CAF50),
                      fontSize: 22,
                      fontWeight: FontWeight.bold)),
            ),
            content: Column(
              mainAxisSize: MainAxisSize.min,
              children: [
                Text(
                  '${alarm.hour.toString().padLeft(2, '0')}:${alarm.minute.toString().padLeft(2, '0')}',
                  style: const TextStyle(
                    fontSize: 40,
                    fontWeight: FontWeight.bold,
                    color: Colors.white,
                    letterSpacing: 3,
                  ),
                ),
                const SizedBox(height: 12),
                Text(
                  alarm.label,
                  style: const TextStyle(fontSize: 18, color: Colors.white70),
                  textAlign: TextAlign.center,
                ),
                if (alarm.autoSnooze) ...[
                  const SizedBox(height: 12),
                  Text(
                    '⏳ سيتم الغفوة تلقائياً بعد ${alarm.snoozeDuration} دقيقة',
                    style: const TextStyle(
                        color: Color(0xFFFF9800), fontSize: 13),
                    textAlign: TextAlign.center,
                  ),
                ],
              ],
            ),
            actions: [
              Row(
                mainAxisAlignment: MainAxisAlignment.spaceEvenly,
                children: [
                  ElevatedButton.icon(
                    style: ElevatedButton.styleFrom(
                      backgroundColor: const Color(0xFFFF9800),
                      foregroundColor: Colors.black,
                    ),
                    onPressed: () => _snoozeAlarm(alarm),
                    icon: const Icon(Icons.snooze),
                    label: const Text('غفوة'),
                  ),
                  ElevatedButton.icon(
                    style: ElevatedButton.styleFrom(
                      backgroundColor: const Color(0xFFF44336),
                    ),
                    onPressed: _stopAlarm,
                    icon: const Icon(Icons.stop),
                    label: const Text('إيقاف'),
                  ),
                ],
              ),
            ],
          ),
        );
      },
    );

    // الغفوة التلقائية
    if (alarm.autoSnooze) {
      _autoSnoozeTimer?.cancel();
      _autoSnoozeTimer = Timer(
        Duration(minutes: alarm.snoozeDuration),
        () {
          if (_activeAlarmId == alarm.id && mounted) {
            _snoozeAlarm(alarm);
          }
        },
      );
    }
  }

  void _stopAlarm() {
    _autoSnoozeTimer?.cancel();
    _audioPlayer.stop();
    if (mounted) {
      Navigator.of(context).popUntil((route) => route.isFirst);
      setState(() => _activeAlarmId = null);
    }
  }

  void _snoozeAlarm(Alarm alarm) {
    _autoSnoozeTimer?.cancel();
    _audioPlayer.stop();

    final now = DateTime.now();
    final snoozeTime = now.add(Duration(minutes: alarm.snoozeDuration));

    final snoozeAlarm = Alarm(
      id: DateTime.now().microsecondsSinceEpoch.toString(),
      hour: snoozeTime.hour,
      minute: snoozeTime.minute,
      label: '⏰ غفوة: ${alarm.label}',
      sound: alarm.sound,
      repeatDaily: false,
      autoSnooze: false,
      snoozeDuration: alarm.snoozeDuration,
    );

    setState(() {
      alarms.add(snoozeAlarm);
      _activeAlarmId = null;
    });
    _saveAlarms();

    if (mounted) {
      Navigator.of(context).popUntil((route) => route.isFirst);
      ScaffoldMessenger.of(context).showSnackBar(
        SnackBar(
          content: Text(
            'تم ضبط غفوة حتى ${snoozeTime.hour.toString().padLeft(2, '0')}:${snoozeTime.minute.toString().padLeft(2, '0')}',
          ),
          backgroundColor: const Color(0xFFFF9800),
        ),
      );
    }
  }

  // ---------- تنسيق الوقت ----------
  String _formatTime(DateTime dt) {
    return '${dt.hour.toString().padLeft(2, '0')}:${dt.minute.toString().padLeft(2, '0')}:${dt.second.toString().padLeft(2, '0')}';
  }

